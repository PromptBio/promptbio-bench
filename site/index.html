<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>promptbio-bench dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>promptbio-bench</h1>
    <p class="subtitle">Live agent comparison dashboard</p>
  </header>

  <div id="error-banner" class="error-banner" hidden></div>

  <section>
    <h2>Agents</h2>
    <div id="agent-picker" class="agent-picker"></div>
  </section>

  <section>
    <h2>Accuracy</h2>
    <div id="accuracy-charts" class="chart-row"></div>
  </section>

  <section>
    <h2>Completion</h2>
    <div id="completion-charts" class="chart-row"></div>
  </section>

  <section>
    <h2>Computation cost</h2>
    <div id="cost-charts" class="chart-row"></div>
  </section>

  <section>
    <h2>Task composition</h2>
    <div id="composition-charts" class="chart-row"></div>
  </section>

  <footer>
    <p>
      Data: <code>site/data/results.csv</code>, generated by
      <code>analysis/prepare_dashboard_data.py</code>.
    </p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
