name: eval
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.12

  # LLM
  - langchain
  - langchain-community
  - langchain-openai
  - openai
  - python-dotenv

  # Core data science
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - pydantic

  # Testing
  - pytest

  # Bioinformatics Python
  - biopython
  - pysam
  - pybedtools
  - pyBigWig
  - anndata
  - scanpy
  - gffutils
  - pyreadr

  # Image / document
  - pillow
  - pdf2image
  - poppler
  - cairosvg
  - openpyxl              # pandas Excel (.xlsx) support — table.py

  # R (for R-based comparison tools)
  - r-base
  - r-jsonlite            # rdata.py inline R scripts, get_r_object_info.R
  - r-optparse            # all helper R scripts
  - r-seurat              # seurat_to_h5ad.R
  - r-seuratdisk          # seurat_to_h5ad.R
  - bioconductor-singlecellexperiment  # sce_to_h5ad.R
  - bioconductor-zellkonverter         # sce_to_h5ad.R

  # CLI tools (called via subprocess)
  - samtools>=1.9   # bam.py, bai.py — needs modern `sort -o FILE` / `depth -a` syntax
  - bcftools>=1.9   # bam.py, vcf.py
  - htslib>=1.9     # bgzip, tabix — bed.py
  - bedtools        # pybedtools runtime dependency
  - bedops          # sort-bed — bed.py
  - tree            # folder.py
  - perl            # syntax.py
  - julia           # syntax.py
